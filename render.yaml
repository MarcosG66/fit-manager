services:
  - type: web
    name: fitmanager-final
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: npm run start:cloud --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: DB_SSL_CA
        sync: false
      # Inicializa/migra automaticamente o MySQL no deploy inicial.
      # Depois de publicar, pode ser desativado para acelerar reinicializações.
      - key: DB_AUTO_INIT
        value: 'true'
      - key: DEMO_SEED
        value: 'false'
      - key: ADMIN_SIGNUP_CODE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESET_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: APP_TIMEZONE
        value: America/Fortaleza
      # Opcional: ativar e-mails reais via HTTPS (Resend)
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: RESEND_FROM
      #   sync: false
